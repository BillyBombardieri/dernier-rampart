; Réglages du moteur pour Dernier Rempart (version Unreal Engine 5).

[/Script/EngineSettings.GameMapsSettings]
; Pas encore de vraie carte : on part de la carte vide du moteur, et le mode de jeu
; construit un terrain d'essai quand on appuie sur Play.
EditorStartupMap=/Engine/Maps/Entry
GameDefaultMap=/Engine/Maps/Entry
GlobalDefaultGameMode=/Script/DernierRempart.DRGameMode

[/Script/Engine.RendererSettings]
; Lumen pour l'éclairage global et les reflets, ombres virtuelles, Nanite.
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.Nanite.ProjectEnabled=True
r.AllowStaticLighting=False
; Lumen logiciel : marche sur toutes les cartes DirectX 12, sans carte « RTX ».
r.RayTracing=False
r.SkinCache.CompileShaders=True
r.AntiAliasingMethod=4
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6

[/Script/Engine.Engine]
; Plan de coupe proche à 3 cm, comme dans Godot, pour que l'arme tenue en main ne soit pas coupée.
NearClipPlane=3.0

[/Script/Engine.LocalPlayer]
; Le champ de vision est vertical, comme dans Godot (78° par défaut).
AspectRatioAxisConstraint=AspectRatio_MaintainYFOV
